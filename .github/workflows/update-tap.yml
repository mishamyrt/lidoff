name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256
        id: sha
        env:
          TAG: ${{ github.ref_name }}
        run: |
          URL="https://github.com/mishamyrt/lidoff/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mishamyrt/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          URL: ${{ steps.sha.outputs.url }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s|url \".*\"|url \"$URL\"|" Formula/lidoff.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|" Formula/lidoff.rb

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lidoff.rb
          git commit -m "chore: update lidoff to ${TAG}"
          git push
